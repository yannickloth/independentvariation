<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Symmetric Venn diagram of the change-driver space of the notification system. Three driver sets gamma_content, gamma_channel, gamma_policy overlap symmetrically at 120 degrees, generating seven regions — the partitions. The single-driver regions hold pure elements: gamma_content (e1), gamma_channel (e3, e4, e5), gamma_policy (e6). Composite elements occupy the overlaps: content-channel (e9), content-policy (e2), channel-policy (e7, e8). The all-three region is empty.">
  <defs>
    <style>
      .venn-circle { fill-opacity: 0.3; stroke-width: 2.5; }
      .venn-title { font: bold 19px sans-serif; text-anchor: middle; fill: #111; }
      .venn-elem { font: 16px sans-serif; text-anchor: middle; fill: #111; }
      .venn-empty { font: bold 20px serif; text-anchor: middle; fill: #999; }
      .venn-cap { font: italic 13px sans-serif; text-anchor: middle; fill: #555; }
    </style>
  </defs>

  <!-- Three driver sets overlapping symmetrically at 120 degrees -->
  <circle cx="450" cy="335" r="105" fill="#4e79a7" stroke="#4e79a7" class="venn-circle"/>
  <circle cx="376" cy="208" r="105" fill="#f28e2b" stroke="#f28e2b" class="venn-circle"/>
  <circle cx="524" cy="207" r="105" fill="#59a14f" stroke="#59a14f" class="venn-circle"/>

  <!-- Driver labels (in the canvas margins) -->
  <text x="450" y="455" class="venn-title">γ_content</text>
  <text x="195" y="212" class="venn-title">γ_channel</text>
  <text x="705" y="212" class="venn-title">γ_policy</text>

  <!-- Single-driver regions -->
  <text x="450" y="358" class="venn-elem">e1</text>                    <!-- content -->
  <text x="351" y="185" class="venn-elem">e3, e4, e5</text>             <!-- channel -->
  <text x="549" y="185" class="venn-elem">e6</text>                     <!-- policy -->

  <!-- Composite regions (overlaps), occupied -->
  <text x="399" y="282" class="venn-elem" fill="#8b2a2a">e9</text>      <!-- content∩channel -->
  <text x="501" y="282" class="venn-elem" fill="#8b2a2a">e2</text>      <!-- content∩policy -->
  <text x="450" y="188" class="venn-elem" fill="#8b2a2a">e7, e8</text>  <!-- channel∩policy -->

  <!-- Composite region still empty: all three -->
  <text x="450" y="252" class="venn-empty">∅</text>

  <text x="450" y="478" class="venn-cap">The 120°-symmetric partial overlaps generate seven regions — the partitions.</text>
  <text x="450" y="494" class="venn-cap">Pure elements fill the single-driver regions; composite elements fill the overlaps.</text>
</svg>
